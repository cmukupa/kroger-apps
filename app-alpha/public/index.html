<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>app-alpha - Store Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    select { width: 100%; padding: .5rem; font-size: 1rem; }
    #details { margin-top: 1.5rem; padding: 1rem; background: #f7f8fa; border: 1px solid #e5e7eb; min-height: 3rem; }
  </style>
</head>
<body>
  <h1>app-alpha - Store Lookup</h1>
  <label for="store">Store</label>
  <select id="store">
    <option value="">Select a store</option>
  </select>
  <div id="details">No store selected.</div>
  <script src="/app.js"></script>
</body>
</html>
