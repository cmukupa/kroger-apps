apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alpha
  namespace: kroger-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-alpha
  template:
    metadata:
      labels:
        app: app-alpha
    spec:
      serviceAccountName: bob-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-alpha
          image: image-registry.openshift-image-registry.svc:5000/kroger-remediation/app-alpha:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: KAFKA_BROKERS
              value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
            - name: KAFKA_APP_EVENTS_TOPIC
              value: "app-events"
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confluent-credentials
                  key: KAFKA_API_KEY
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: confluent-credentials
                  key: KAFKA_API_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: app-alpha
  namespace: kroger-remediation
spec:
  selector:
    app: app-alpha
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-alpha
  namespace: kroger-remediation
spec:
  to:
    kind: Service
    name: app-alpha
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
